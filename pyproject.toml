[build-system]
requires = ["setuptools>=77.0.3"]
build-backend = "setuptools.build_meta"

[project]
name = "tt-openvla-serving"
version = "0.3.0"
description = "OpenVLA-7B (vision-language-action) on Tenstorrent Blackhole via TTNN. For local development only. The published episod/tt-openvla bundle does not install this package: scripts/package-thin.sh ships the served-path files under the bundle's extra_code/ (scripts/thin/served_files.txt lists them)."
requires-python = ">=3.10"

[tool.setuptools.packages.find]
include = ["gradio_app*", "tt*"]

[tool.setuptools.package-data]
gradio_app = ["assets/*.jpg"]
