[build-system]
requires = ["setuptools>=77.0.3"]
build-backend = "setuptools.build_meta"

[project]
name = "tt-openvla-serving"
version = "0.2.0"
description = "OpenVLA-7B (vision-language-action) on Tenstorrent Blackhole via TTNN. The published tt-openvla-serving wheel is built by scripts/build-serving-wheel.sh, which stages only the served-path closure (gradio_app + the tt/ modules backends.py reaches, incl. openvla_weights.py) and asserts nothing else is in it. A plain `uv build` here packages the full gradio_app/ and tt/ trees (bring-up scripts and tests included) for local dev only; do not publish that."
requires-python = ">=3.10"

[tool.setuptools.packages.find]
include = ["gradio_app*", "tt*"]

[tool.setuptools.package-data]
gradio_app = ["assets/*.jpg"]
